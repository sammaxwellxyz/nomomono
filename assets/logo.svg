<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">nomomono sad face logo</title>
  <desc id="desc">A sad face emoticon set in ui-monospace.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f7fb" />
      <stop offset="100%" stop-color="#e9edf5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)" />

  <g filter="url(#shadow)">
    <rect x="44" y="66" width="424" height="380" rx="40" fill="#ffffff" />
  </g>

  <g fill="#111827" text-anchor="middle">
    <text
      x="256"
      y="256"
      font-size="230"
      font-weight="700"
      font-family="ui-monospace, monospace"
      letter-spacing="2"
      dominant-baseline="middle"
    >
      :(
    </text>
  </g>
</svg>
